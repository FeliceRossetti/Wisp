[package]
name = "wisp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight, good-looking desktop app for WhatsApp Web (unofficial)"
license = "MIT"
repository = "https://github.com/FeliceRossetti/Wisp"
homepage = "https://github.com/FeliceRossetti/Wisp"
readme = "README.md"
keywords = ["whatsapp", "desktop", "webview", "messaging", "tray"]
categories = ["gui"]
publish = false

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
getrandom = "0.4.3"
notify-rust = "4.19.0"
open = "5.4.5"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tao = "0.37.2"
toml = "1.2.1"
tray-icon = "0.26.1"
url = "2.5.8"
wry = "0.57.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_Storage_EnhancedStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
windows-future = "0.3"
windows-registry = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# The PIN hash is deliberately slow; keep it fast enough in debug builds and tests.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
