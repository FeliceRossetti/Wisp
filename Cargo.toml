[package]
name = "wisp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight, good-looking desktop app for WhatsApp Web (unofficial)"
license = "MIT"
repository = "https://github.com/FeliceRossetti/Wisp"
homepage = "https://github.com/FeliceRossetti/Wisp"
readme = "README.md"
keywords = ["whatsapp", "desktop", "webview", "messaging", "tray"]
categories = ["gui"]
publish = false

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
notify-rust = "4.19.0"
open = "5.4.5"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
toml = "1.2.1"
tray-icon = "0.26.1"
url = "2.5.8"
wry = "0.57.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
