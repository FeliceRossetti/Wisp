name: Feature request
description: Suggest an idea or improvement for Wisp.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Wisp stays lightweight and only uses the official WhatsApp Web client, so features that
        automate accounts or reimplement the protocol are out of scope (see CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this.
