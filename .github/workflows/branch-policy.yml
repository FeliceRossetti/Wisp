name: Branch policy

# main only receives releases: pull requests into main must come from dev
# (or a hotfix/* branch for an urgent fix that is merged back into dev).
on:
  pull_request:
    branches: [main]

jobs:
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          case "$HEAD" in
            dev|hotfix/*) echo "OK: $HEAD -> main" ;;
            *) echo "::error::Only dev (or hotfix/*) may be merged into main. Open this PR against dev instead."; exit 1 ;;
          esac
